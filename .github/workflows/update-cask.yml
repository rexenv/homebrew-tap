# Keep Casks/rexenv.rb in step with the latest PUBLISHED release of SOURCE_REPO.
#
# SOURCE_REPO is THIS repo for now, not rexenv/rexenv: the app repo is private, and
# `brew` fetches a cask's url anonymously — a private repo's release asset answers
# 404 to an unauthenticated GET, so the dmg has to be released somewhere public.
# The source stays private; only the artefact moves. When rexenv/rexenv goes public,
# set SOURCE_REPO back to rexenv/rexenv and flip the cask's url + `verified:` in the
# same commit — the two must always name the same repo, or this workflow would hash
# one repo's asset into a cask pointing at another's.
#
# This lives in the TAP repo, not the app repo, on purpose: a workflow pushing to
# its OWN repo uses the built-in GITHUB_TOKEN, so the whole pipeline needs no PAT,
# no deploy key, and no stored secret of any kind. (The app repo cannot push here
# without a cross-repo credential; the org has deploy keys disabled, and GitHub has
# no API to mint a PAT — so cross-repo push would mean a hand-made token that
# expires and silently breaks releases.)
#
# The trade is latency: this polls instead of being pushed to. A release is picked
# up within ~15 minutes, or instantly via Actions → "Update cask" → Run workflow.
#
# The sha256 is computed from the DOWNLOADED release asset — the rule from
# docs/PUBLISH-TESTING.md §D, enforced by construction: this runner never builds.
name: Update cask

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write # push the version + sha256 bump to this repo

jobs:
  bump:
    name: Bump rexenv cask to the latest release
    runs-on: ubuntu-latest
    env:
      # Where the published dmg lives. Interim: this repo (app repo still private).
      SOURCE_REPO: rexenv/homebrew-tap
    steps:
      - uses: actions/checkout@v4

      - name: Compare the cask against the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(sed -n -E 's/^  version "(.*)"$/\1/p' Casks/rexenv.rb)
          [ -n "$CURRENT" ] || { echo "::error::could not read the cask's current version" >&2; exit 1; }

          # The cask must point at the repo we are about to hash. If these ever
          # disagree, the bump would write SOURCE_REPO's sha256 into a cask that
          # downloads a different repo's file — every install then fails the hash
          # check. Fail here instead, where it is one line to read.
          grep -q "^  url \"https://github.com/${SOURCE_REPO}/releases/download/" Casks/rexenv.rb || {
            echo "::error::cask url does not point at ${SOURCE_REPO} — flip the cask and SOURCE_REPO together" >&2
            grep -n '^  url ' Casks/rexenv.rb >&2
            exit 1
          }

          # --exclude-drafts/--exclude-pre-releases: a draft release is one that has
          # NOT passed the human §A launch gate yet, and shipping it to users would
          # defeat the gate. Publishing IS the sign-off.
          LATEST=$(gh release list --repo "$SOURCE_REPO" --limit 1 \
                     --exclude-drafts --exclude-pre-releases \
                     --json tagName --jq '.[0].tagName // ""' || true)
          if [ -z "$LATEST" ]; then
            echo "no published release on $SOURCE_REPO yet (or it is not public) — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          V="${LATEST#v}"
          echo "cask is at $CURRENT; latest published release is $V"
          if [ "$V" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "skip=false"
              echo "tag=$LATEST"
              echo "version=$V"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download the published dmg and hash it
        if: steps.check.outputs.skip == 'false'
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="rexenv_${VERSION}_universal.dmg"
          gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$ASSET"
          SHA=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          echo "downloaded $ASSET — sha256 $SHA"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          rm -f "$ASSET"

      - name: Rewrite the cask stanzas and push
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          sed -i -E "s|^(  version \").*(\")$|\1${VERSION}\2|" Casks/rexenv.rb
          sed -i -E "s|^(  sha256 \").*(\")$|\1${SHA256}\2|" Casks/rexenv.rb

          # The edit must have landed EXACTLY — a sed that silently matched nothing
          # would push an unchanged cask and report success.
          grep -q "^  version \"${VERSION}\"$" Casks/rexenv.rb
          grep -q "^  sha256 \"${SHA256}\"$" Casks/rexenv.rb

          if git diff --quiet; then
            echo "cask already at ${VERSION} / ${SHA256} — nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "rexenv ${VERSION}" \
            -m "Automated bump from the published release ${VERSION}; sha256 computed from the downloaded release asset."
          git push
          echo "tap bumped — users get it via: brew update && brew upgrade --cask rexenv"
